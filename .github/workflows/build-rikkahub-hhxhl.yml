name: Build RikkaHub (hhxhl)

# Manual signed release build; upload APKs to Actions Artifacts only.
on:
  workflow_dispatch:
    inputs:
      build_branch:
        description: '要构建的源码分支'
        required: true
        default: 'master-hhxhl'
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/master-hhxhl'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_branch }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Restore release keystore
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEY_BASE64" ]]; then
            echo 'Missing Actions secret: KEY_BASE64' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEY_BASE64" | base64 --decode > app/app.key
          test -s app/app.key

      - name: Build signed GitHub Release APKs
        env:
          SIGNING_STORE_FILE: app.key
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SIGNING_STORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD secret}"
          : "${SIGNING_KEY_ALIAS:?Missing SIGNING_KEY_ALIAS secret}"
          : "${SIGNING_KEY_PASSWORD:?Missing SIGNING_KEY_PASSWORD secret}"
          chmod +x gradlew
          ./gradlew :app:assembleGithubRelease --stacktrace

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          shopt -s nullglob
          apks=(app/build/outputs/apk/github/release/*.apk)
          (( ${#apks[@]} > 0 ))
          for apk in "${apks[@]}"; do
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-hhxhl-release-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
          retention-days: 30
